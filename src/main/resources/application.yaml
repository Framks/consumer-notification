spring:
  application:
    name: consumer-notification
  rabbitmq:
    host: rabbitmq.broker # nome curto só resolve dentro do mesmo namespace; entre namespaces precisa de <service>.<namespace>
    port: 5672
    username: notification
    password: notification
    listener:
      simple:
        default-requeue-rejected: false

notification:
  max-retries: 3
